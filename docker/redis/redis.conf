# SerpFlow hot cache (section 18).
#
# Redis is the hot layer and is NOT the source of truth. The durable cache
# index lives in PostgreSQL and object payloads live in object storage, so a
# Redis restart repopulates lazily and loses no credits.
#
# appendonly is on anyway so a restart does not cold-start the whole cache.

appendonly yes
appendfsync everysec
maxmemory 512mb
maxmemory-policy allkeys-lru
save 900 1
save 300 10
timeout 0
tcp-keepalive 300
