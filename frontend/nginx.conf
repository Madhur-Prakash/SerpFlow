server {
    listen 80;
    # Also accept IPv6. Without this the container answers on 127.0.0.1 but not
    # on ::1, and anything resolving "localhost" to the v6 address first - the
    # healthcheck, for one - gets a connection refused from a server that is
    # in fact running.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The API sets its own on every response; these cover the
    # static bundle.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Server-Sent Events. Buffering would hold frames until the response ended,
    # which would defeat the entire point of streaming stage transitions.
    location ~ ^/v1/runs/[^/]+/stream$ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 10m;
    }

    location ~ ^/(v1|healthz|readyz|metrics|docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Client-side routing: every unknown path serves the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
