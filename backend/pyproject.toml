[project]
name = "serpflow"
version = "0.1.0"
description = "SerpFlow - a search control plane for SerpApi with cache-aware marginal-cost replanning"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "SerpFlow Contributors" }]
keywords = ["serpapi", "search", "planner", "cache", "control-plane"]

dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.43",
    "greenlet>=3.2.0",
    "alembic>=1.16.0",
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.4.1",
    "redis>=6.0.0",
    "aiokafka>=0.12.0",
    "httpx>=0.28.1",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.10.1",
    "cryptography>=46.0.0",
    "pyyaml>=6.0.2",
    "python-multipart>=0.0.20",
    "email-validator>=2.3.0",
    "typer>=0.19.0",
    "rich>=14.1.0",
    "prometheus-client>=0.23.0",
    "opentelemetry-api>=1.37.0",
    "opentelemetry-sdk>=1.37.0",
    "opentelemetry-instrumentation-fastapi>=0.58b0",
    "opentelemetry-exporter-otlp-proto-http>=1.37.0",
    "logifyx>=2.0.0",
    "sse-starlette>=3.0.0",
    "numpy>=2.3.0",
    "mcp>=1.16.0",
    "boto3>=1.40.0",
    "tenacity>=9.1.2",
    "jinja2>=3.1.4",
    # Gmail API delivery. google-auth owns the token lifecycle and
    # google-api-python-client owns the send, so neither is reimplemented here.
    "google-api-python-client>=2.150.0",
    "google-auth>=2.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "types-pyyaml>=6.0.12",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.0",
    # Only scripts/mint_gmail_token.py runs a consent flow, so this stays out
    # of the runtime dependency set and out of the container image.
    "google-auth-oauthlib>=1.2.1",
]

[project.scripts]
serpflow = "app.cli.main:app"
serpflow-mcp = "app.mcp.server:main"

[project.urls]
Homepage = "https://github.com/serpflow/serpflow"
Documentation = "https://github.com/serpflow/serpflow/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
# extend-exclude, not exclude: `exclude` replaces ruff's defaults, which would
# pull .venv into every lint run.
extend-exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "S"]
ignore = ["E501", "B008", "S101", "S105", "S106", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
# The deterministic mock generates demo SERP payloads, not secrets. It is
# seeded per request precisely so the same intent returns the same results.
"app/integrations/serpapi/mock.py" = ["S311"]

[tool.mypy]
python_version = "3.13"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
exclude = "alembic/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
log_cli = false
log_level = "WARNING"
markers = [
    "integration: requires postgres/redis/kafka",
    "e2e: full end-to-end flow",
]
